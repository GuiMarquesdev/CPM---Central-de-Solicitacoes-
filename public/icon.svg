<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  <!-- M Pillars -->
  <path d="M 15 30 C 15 18, 25 12, 25 25 L 25 55 C 25 67, 15 73, 15 60 Z" fill="url(#silverGradient)" stroke="#334155" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M 27 30 C 27 18, 37 12, 37 25 L 37 55 C 37 67, 27 73, 27 60 Z" fill="url(#silverGradient)" stroke="#334155" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M 39 30 C 39 18, 49 12, 49 25 L 49 55 C 49 67, 39 73, 39 60 Z" fill="url(#silverGradient)" stroke="#334155" stroke-width="1.2" stroke-linejoin="round" />
  <!-- P Letter (using evenodd to hollow out the loop) -->
  <path d="M 51 30 C 51 18, 61 12, 61 25 C 76 22, 88 28, 88 40 C 88 52, 76 58, 61 55 L 61 72 C 61 84, 51 90, 51 77 Z M 61 32 C 70 30, 78 33, 78 40 C 78 47, 70 50, 61 48 Z" fill="url(#silverGradient)" fill-rule="evenodd" stroke="#334155" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Flame inside the loop of P -->
  <path d="M 65 46 C 62 42, 63 36, 67 33 C 65 37, 68 40, 70 39 C 69 34, 73 30, 75 28 C 76 33, 74 37, 72 40 C 75 37, 79 38, 79 42 C 79 47, 72 48, 65 46 Z" fill="url(#flameGradient)" stroke="#991B1B" stroke-width="0.8" stroke-linejoin="round" />
</svg>
